template_name: demo_book_multilingual
template_label: Multilingual Book Translation Evaluation
template_description: Compare translations of English Aesop fables.
default_data_link: data/demo/book_multilingual.json
book_evaluation: true
default_language: zh-CN
evaluation_title: Multilingual Book Translation Evaluation
languages:
  - { code: ar, label: Arabic, native_label: العربية }
  - { code: hi, label: Hindi, native_label: हिन्दी }
  - { code: ka, label: Georgian, native_label: ქართული }
  - { code: ru, label: Russian, native_label: Русский }
  - { code: vi, label: Vietnamese, native_label: Tiếng Việt }
  - { code: zh-CN, label: Simplified Chinese, native_label: 简体中文 }
instructions: |
  Read the English fable and compare its translations. Score **Fidelity from 0–100 in steps of 5**. **60** is acceptable. Give higher scores to better translations and equal scores for ties.

  - **Spans**
    - **Strength.** Highlight wording that captures the fable’s meaning and effect especially well, such as apt idioms, metaphors, or cultural references, effective wordplay or irony, distinctive character dialogue, or a memorable moral that echoes the story.
    - **Error.** Highlight wording that distorts meaning or sounds noticeably unnatural.
    - **Unlabeled.** Leave acceptable, ordinary wording unmarked.
  - **Fidelity.** Judge how naturally the translation tells the same story and conveys its lesson. Check the characters’ actions and motives, the tone, and how the ending makes the moral land. Natural rephrasing can earn full credit.

    | 0 | 5–25 | 30–55 | 60–75 | 80–95 | 100 |
    | --- | --- | --- | --- | --- | --- |
    | No usable meaning | Details survive, story or lesson lost | Story recognizable, a key event or lesson needs fixing | Story and lesson intact, noticeably stiff | Faithful and natural, minor polish | Story, voice, and lesson come through naturally |

  - **Flag a problem** if a highlight cannot capture it, such as a missing passage.
  - **Post-edit (optional).** Finish rating the translations, then combine strengths and fix errors to write a better version.
  - **Download** before closing and **upload** the file to resume.
