template_name: demo_manga_comparison
template_label: Manga Translation Comparison
template_description: Compare manga pages, rate overall fidelity and presentation, and annotate generated translation text by region.
default_data_link: data/demo/manga_comparison.json

manga_comparison: true
manga_evaluation: true
manga_text_evaluation: true
edits: []

interface_text:
  typology:
    source_label: "Original Japanese Manga"
    target_label: "Translated Manga"
  hit_box:
    hit_label: "Manga Page"

prepend_instructions: true
instructions: |
  ## Manga Translation Comparison

  Compare A and B with the Japanese original; rate each independently. All scores: **0–100, steps of 5** (0 = very poor; 100 = excellent). Leave unfinished scores blank.

  - **Region quality:** Meaning, completeness, tone, grammar, and natural wording compared with Japanese. Ignore font and layout.
  - **Region presentation:** Inspect the image: readable font and size, text length, spacing, balloon fit, clipping, and overlap. Ignore translation accuracy.
  - **Spans:** Choose a label, then highlight translated words: **Strength** = especially good wording; **Okay** = acceptable; **Error** = inaccurate or unnatural wording. These labels describe text quality; highlighting is optional.
  - **Page scores:** Fidelity covers meaning and artwork preservation; presentation covers the whole page’s visual readability.
  - **Download** saves both translations; **upload** resumes. **Reset page** clears both on this page.

scores:
  - name: fidelity_score
    label: Fidelity
    question: "How well are meaning, tone, story, characters, and original artwork preserved?"
    min: 0
    max: 100
    step: 5
  - name: presentation_score
    label: Presentation
    question: "How readable and visually polished are the lettering, placement, and rendered image?"
    min: 0
    max: 100
    step: 5
