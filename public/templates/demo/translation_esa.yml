template_name: demo_translation_esa
template_label: Translation ESA Annotation
template_description: Annotate ESA-style errors independently across multiple candidate translations.

default_data_link: data/demo/translation_strength.json

tokenization: char
multi_candidate: true
auto_add_spans: true

display:
  - text-side-by-side
  - disable-lines

font_size:
  source: 14
  target: 14

interface_text:
  typology:
    source_label: "Source Text"
    target_label: "Translation"
  annotation_editor:
    select_edit_header: "Select Error."
  annotation_viewer:
    header: "Span Annotations"

prepend_instructions: true

instructions: |
  ## Error Span Annotation (ESA)

  - **Mark each error separately** with a precise span in the **source, translation, or both**. Either side is optional, but each annotation needs at least one span. For omissions, select the missing content in the source; for additions, select the unsupported text in the translation.
  - Assign **severity only**, without an error category: **Minor** for awkward wording or other imperfections that leave the core message intact; **Major** for errors that distort the source meaning or make the message confusing.
  - **Highlight to add:** Each selection automatically creates an error span and opens the severity chooser. Select Minor or Major and save. Use the Add button to link spans on both sides in one annotation.
  - Treat **unsupported added content as Major**. For a translation entirely in the wrong language, mark the whole text as Major and score it **0**.
  - **Overall score (0–100, in steps of 5):** Judge meaning preservation and naturalness across the whole translation, not just error count. Choose 0, 5, 10, …, 100 using these anchors as guidance:
    **0 — Broken:** Meaning is lost or the text is incoherent;
    **33 — Flawed:** Only part of the meaning is conveyed; major rewriting is needed;
    **66 — Good:** Most meaning is preserved; minor inaccuracies or awkwardness need correction;
    **100 — Perfect:** Full meaning and tone are preserved in natural language; no correction is needed.

overall_score:
  name: overall_score
  label: "Overall Translation Score"
  question: "Considering meaning preservation and quality, how would you rate this translation?"
  min: 0
  max: 100
  step: 5
  anchors:
    - value: 0
      label: "Broken"
    - value: 33
      label: "Flawed"
    - value: 66
      label: "Good"
    - value: 100
      label: "Perfect"

edits:
  - name: error
    label: "Error"
    color: red
    icon: fa-triangle-exclamation

    enable_input: true
    optional_input: true
    enable_output: true
    optional_output: true
    type: single_span

    annotation:
      - name: severity
        label: "Severity"
        question: "How severe is this error?"
        options:
          - name: minor
            label: "Minor"
          - name: major
            label: "Major"
