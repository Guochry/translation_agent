template_name: demo_manga_translation
template_label: Manga Translation Evaluation
template_description: Compare manga pages, rate overall fidelity and presentation, and annotate generated translation text by region.
default_data_link: data/demo/manga_translation.json

manga_evaluation: true
manga_text_evaluation: true
edits: []

interface_text:
  typology:
    source_label: "Original Japanese Manga"
    target_label: "Translated Manga"
  hit_box:
    hit_label: "Manga Page"

prepend_instructions: true
instructions: |
  ## Manga Translation Evaluation

  Compare the original Japanese page with the translation. Use **0–100 in steps of 5** for all scores; higher is better. **0** is valid; leave unfinished scores blank.

  - **Fidelity:** Preservation of meaning, tone, story, characters, and artwork. Replacing Japanese lettering with English is expected.
  - **Presentation:** Readability, typography, text placement, and visual polish.
  - **Text quality:** Accuracy and natural English for each generated region. Highlight errors in the generated translation.
  - Match references and generated regions by content, not numbering.
  - Rate both page scores and every generated region. **Download** to save; **upload** to resume. **Reset page** clears the current page's ratings and highlights.

scores:
  - name: fidelity_score
    label: Fidelity
    question: "How well are meaning, tone, story, characters, and original artwork preserved?"
    min: 0
    max: 100
    step: 5
  - name: presentation_score
    label: Presentation
    question: "How readable and visually polished are the lettering, placement, and rendered image?"
    min: 0
    max: 100
    step: 5
