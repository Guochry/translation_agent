template_name: demo_subtitle_multilingual
template_label: Multilingual Subtitle Evaluation
template_description: Evaluate selected clips in movie order, favoring longer subtitles.
default_data_link: data/demo/subtitle_multilingual.json
subtitle_evaluation: true
default_language: en
# Videos are hosted separately from GitHub Pages; local dev uses the prepared media links.
subtitle_media_base: https://huggingface.co/datasets/geyang627/subtitle-translation-evaluation/resolve/e0731a937af24b26173a59636d3786b6253f32a6/
subtitle_media_prefix: evaluation_assets/subtitle_evaluation/
languages:
  - { code: ar, label: Arabic, native_label: العربية }
  - { code: en, label: English, native_label: English }
  - { code: hi, label: Hindi, native_label: हिन्दी }
  - { code: ka, label: Georgian, native_label: ქართული }
  - { code: ru, label: Russian, native_label: Русский }
  - { code: vi, label: Vietnamese, native_label: Tiếng Việt }
instructions: |
  Watch the clip and check dialogue context. Rate each translation independently on a **0–100 scale in steps of 5**. Give equal scores for equal quality. Leave unfinished scores blank.

  - **Spans.** Mark the smallest useful phrase. **Strength** rewards creative wording such as idioms, wordplay, or cultural references that preserve meaning in context. **Error** marks inaccurate or materially unnatural wording. Leave acceptable text unmarked.
  - **Fidelity.** Judge meaning, accuracy, completeness, style, tone, and fit with the scene. Check who does what, negation, and idioms. Concise wording and other plausible readings can earn full credit.

    | Fidelity score | Meaning |
    | --- | --- |
    | 0 | No usable meaning |
    | 5–25 | Some words or the topic are recognizable. The main message is lost. |
    | 30–55 | The main message is recognizable. A meaning or tone error needs fixing. |
    | 60–75 | Meaning and tone come through. The wording is noticeably stiff or clumsy. |
    | 80–95 | Accurate and natural. Only small wording or style tweaks would help. |
    | 100 | Fully accurate and natural in context |

  - **Presentation.** Judge length, reading time, line breaks, and sync with speech during normal playback. **60** = readable without a necessary fix.
  - **References and issues.** Use the human reference and Google Translate as cross-checks. Use **Issue or uncertainty** for missing meaning, unresolved source meaning, or text that differs from the video. Score the subtitle viewers see when you can assess it. Leave any score you cannot assess blank.
  - **Post-edit (optional).** Finish your candidate ratings first. Then combine strengths and fix errors to write a faithful, readable subtitle.
  - Before closing, **download your annotations**. To resume, **upload that downloaded file**.

evaluation_title: "Multilingual Subtitle Evaluation"
